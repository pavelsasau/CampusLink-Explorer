
<!DOCTYPE html>
<html lang="fr">

<head>
    <!-- Encodage des caractères | Кодировка символов -->
    <meta charset="UTF-8">

    <!-- Adaptation mobile | Адаптация для телефонов -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusLink Explorer — Carte du monde</title>

    <!-- Styles de la carte | Стили карты -->
    <link rel="stylesheet" href="/static/map.css">

    <!-- JavaScript pour le zoom et le déplacement | Управление картой -->
    <script src="/static/map.js" defer></script>
</head>

<body>

    <!-- Page plein écran | Страница на весь экран -->
    <main class="explore-page">

        <!-- Carte interactive | Интерактивная карта -->
        <div class="map-viewport" id="map-viewport">
            <p id="map-loading">Chargement de la carte...</p>
        </div>

        <!-- En-tête flottant | Плавающая шапка -->
        <header class="map-header">

            <!-- Nom du projet | Название проекта -->
            <a href="/" class="project-logo">

                <span class="logo-icon">🌍</span>

                <span class="logo-text">
                    <strong>CAMPUSLINK</strong>
                    <small>EXPLORER</small>
                </span>

            </a>

            <!-- Recherche de villes | Поиск городов -->
            <form action="/search" method="GET" class="search-form">

                <span class="search-icon">⌕</span>

                <input
                    type="search"
                    name="city"
                    placeholder="Rechercher une ville..."
                    aria-label="Rechercher une ville"
                    minlength="2"
                    required
                >

                <button type="submit" aria-label="Rechercher">
                    →
                </button>

            </form>

        </header>

        <!-- Commandes de zoom | Управление масштабом -->
        <div class="zoom-controls">

            <!-- Agrandir la carte | Увеличить карту -->
            <button id="zoom-in" type="button" aria-label="Zoom avant">
                +
            </button>

            <!-- Niveau de zoom | Текущий масштаб -->
            <span id="zoom-level">100%</span>

            <!-- Réduire la carte | Уменьшить карту -->
            <button id="zoom-out" type="button" aria-label="Zoom arrière">
                −
            </button>

            <!-- Réinitialiser le zoom | Сбросить масштаб -->
            <button id="zoom-reset" type="button" aria-label="Réinitialiser">
                ↺
            </button>

        </div>

        <!-- Instructions | Подсказки -->
        <p class="map-help">
            Molette : zoom · Glisser : déplacer · Clic : choisir un pays
        </p>
ё
    </main>
    
</body>
</html>
