
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Explorer</title>
</head>
<body>

    <h1>🌍 Weather Explorer</h1>
    <p>Découvrez les villes du monde entier</p>

    <h2>Rechercher une ville</h2>

    <form action="/search" method="GET">
        <input type="text" name="city" placeholder="Paris, Tokyo, Londres..." required>
        <button type="submit">Rechercher</button>
    </form>

</body>
</html>
